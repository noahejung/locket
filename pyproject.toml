[project]
name = "locket"
version = "0.1.0"
description = "Privacy-first personal context engine: your data exhaust, structured and served over MCP"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12",
  "mcp==2.0.0",
  "langgraph==1.2.10",
  "langchain-core==1.5.3",
  "langchain-anthropic==1.5.3",
  "psycopg[binary]==3.3.4",
  "pgvector==0.5.0",
  "sentence-transformers==5.6.1",
  "transformers==5.14.1",
  "torch==2.13.0",
  "insightface==1.0.1",
  "onnxruntime==1.28.0",
  "scikit-learn>=1.5",
  "rapidocr==3.9.2",
  "pillow==12.3.0",
  "pillow-heif==1.5.0",
  "lxml==6.1.1",
  "ftfy==6.3.1",
  "ragas==0.4.3",
  # ragas 0.4.3's `import ragas` chain unconditionally imports
  # langchain_community.chat_models.vertexai (ragas/llms/base.py), even though the
  # modern ragas.metrics.collections API (Task 16) never touches LangChain-wrapped
  # LLMs at runtime. langchain-community is unpinned in ragas's own metadata; 0.4.2
  # (latest at build time) dropped chat_models/vertexai.py entirely as part of its
  # "sunset" integration cleanup, breaking the import with
  # ModuleNotFoundError: No module named 'langchain_community.chat_models.vertexai'.
  # Pinned to the last confirmed-working release (verified 2026-07-30 by inspecting
  # the wheel's file list directly) rather than left to float.
  "langchain-community==0.4.1",
  "anthropic==0.120.2",
  "ollama==0.6.2",
  # Local-LLM backend (Task: keyless pipeline). Verified live 2026-07-31 against PyPI
  # metadata: latest is 1.1.0, requires langchain-core<2.0.0,>=1.2.21 (repo pins 1.5.3,
  # compatible) and ollama<1.0.0,>=0.6.1 (repo pins 0.6.2, compatible).
  "langchain-ollama==1.1.0",
  "faker==40.36.0",
  "piexif==1.1.3",
  "opencv-python-headless>=4.10",
  "pyyaml>=6.0",  # evals/gold/*.yaml + questions.yaml (Tasks 15-16) -- was only a
                  # transitive dep (via langchain/huggingface_hub) before; declared
                  # explicitly since we now import it directly.
  # Phone chat UI (locket serve-ui, setup-guide.md Part 2 Option 2). Verified live
  # 2026-08-01 against PyPI metadata: fastapi latest is 0.141.1, requires
  # starlette>=0.46.0 and pydantic>=2.9.0 -- both already satisfied by the versions `mcp`
  # transitively pins in this repo's own lock (starlette 1.3.1, pydantic 2.13.4), so this
  # adds no new transitive major version. uvicorn is already present in the lock too (as
  # mcp's own ASGI-transport dependency, unpinned by us until now) at 0.52.0, which PyPI
  # confirms is also current latest -- pinned explicitly here rather than left implicit,
  # since webui.py now imports it directly (`locket serve-ui`'s `uvicorn.run(...)`).
  # httpx (FastAPI TestClient's transport) is NOT added here -- already resolved
  # transitively at 0.28.1 (via anthropic/mcp's own deps) and nothing in this repo imports
  # it directly, so it stays implicit like every other transitive dep we don't touch.
  "fastapi==0.141.1",
  "uvicorn==0.52.0",
]

[dependency-groups]
# google-genai removed (fix-wave-2 item 7): declared but imported nowhere -- the README's
# Gemini-for-synthetic-corpus path and the --cloud-ok Claude photo fallback are documented
# as planned, not implemented (security audit 2026-07-31, INFO #1). Re-add when either
# lands for real.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import corpusgen/ (not an installed package, lives at repo root)
markers = [
  "db: needs the dockerized postgres",
  "llm: makes live LLM calls (needs ANTHROPIC_API_KEY)",
  "vision: needs local ML models downloaded",
]
addopts = "-m 'not llm and not vision and not db'"   # db excluded too — the mandated between-step `uv run pytest -x -q` must stay green without Docker running

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locket"]
