# Extraction eval gold set — synthetic persona corpus (Task 15).
#
# Every fact below traces to specific messages in corpusgen/conversations.json (0-based
# list index, `thread | platform | speaker | ts | text` as printed by a plain enumerate —
# see the "msg N" comment on each entry; ranges cite the first and last relevant index).
# This is the CI regression set — ~60 facts the SCRIPTED corpus provably contains, distinct
# from the ~100-200 REAL, self-labeled facts Task 19 Step 4b writes about Noah's own life
# (evals/gold/real_gold.local.yaml, gitignored, never in this repo).
#
# Schema (locket.extraction.schemas.FactKind for `kind`; matched by evals/extraction_eval.py):
#   kind: person | place | event | relationship | habit | preference
#   statement: natural-language fact, standalone
#   subjects: canonical persona names involved (corpusgen/personas.py PERSONAS)
#   must_match: regexes (case-insensitive) that must ALL hit the extracted fact's
#               statement for a candidate match — anchors the match beyond kind + cosine
#               similarity so a merely-topically-similar fact can't count as a hit.

