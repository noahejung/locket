services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: locket
      POSTGRES_PASSWORD: locket
      POSTGRES_DB: locket
    ports: ["5432:5432"]
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locket -d locket"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
