name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      # PYSEC-2026-2447 (diskcache 5.6.3, transitive via ragas, dev-only): pickle-RCE needs
      # local write access to the cache dir -- not attacker-reachable from anything this repo
      # runs. PYSEC-2026-3046 (ragas 0.4.3): SSRF in ragas.metrics.multi_modal_faithfulness,
      # a metric this codebase never imports (evals/rag_eval.py only imports
      # ragas.metrics.collections.{Faithfulness,AnswerRelevancy,ContextPrecisionWithReference}
      # -- confirmed unreachable, security audit 2026-07-31). Both pinned by ID, not blanket-
      # ignored, so a NEW advisory on either package (or any other dependency) still fails CI.
      - run: uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2026-2447 --ignore-vuln PYSEC-2026-3046
      - run: uv run ruff check src tests evals corpusgen
      - run: uv run pytest -x -q

  db:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: locket
          POSTGRES_PASSWORD: locket
          POSTGRES_DB: locket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U locket -d locket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCKET_DB_URL: postgresql://locket:locket@localhost:5432/locket
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: PGPASSWORD=locket psql -h localhost -U locket -d locket -f db/init.sql
      - run: uv run pytest -m db
